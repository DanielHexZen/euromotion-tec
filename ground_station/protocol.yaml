# Single source of truth for the PC <-> vehicle link.
# Frame on the wire: COBS( vehicle_id u8 | type u8 | seq u8 | payload | crc16 u16 ) + 0x00
# CRC-16/CCITT-FALSE (poly 0x1021, init 0xFFFF) over header+payload, little-endian.
# Payload fields are packed little-endian, in the order listed.
#
# FROZEN: HELLO (type, layout). A PC with a different protocol hash must still be able
# to read it, otherwise the version check cannot report the mismatch.
# vehicle_id is configuration (bench_config.h / --vehicle-id), not part of this file.
#
# Field types: u8 i8 u16 i16 u32 i32
# ack: true  -> the vehicle answers with ACK{acked_seq}; the PC retries until then.

enums:
  Mode: {IDLE: 0, MANUAL: 1, AUTO: 2, FAULT: 3}

messages:
  # ---- PC -> vehicle ------------------------------------------------------------
  ESTOP:     {id: 0x01, dir: pc2veh, fields: []}
  SET_MODE:  {id: 0x02, dir: pc2veh, ack: true, fields: [{name: mode, type: u8, enum: Mode}]}
  DRIVE:     {id: 0x03, dir: pc2veh, fields: [{name: v_mmps, type: i16}, {name: w_mradps, type: i16}]}
  HEARTBEAT: {id: 0x04, dir: pc2veh, fields: []}
  PING:      {id: 0x05, dir: pc2veh, ack: true, fields: []}

  # ---- vehicle -> PC ------------------------------------------------------------
  HELLO:
    id: 0x80
    dir: veh2pc
    fields: [{name: fw_hash, type: u32}, {name: proto_hash, type: u32}]
  ACK:
    id: 0x81
    dir: veh2pc
    fields: [{name: acked_seq, type: u8}, {name: status, type: u8}]   # status 0 = ok
  TELEM_FAST:
    id: 0x82
    dir: veh2pc
    fields:
      - {name: t_ms,      type: u32}              # vehicle clock, authoritative
      - {name: mode,      type: u8, enum: Mode}   # the mode the vehicle CONFIRMS
      - {name: faults,    type: u8}               # bit field as in bench.c FAULT_*
      - {name: u_l_milli, type: i16}              # applied duty, 1/1000
      - {name: u_r_milli, type: i16}
      - {name: rpm_l_c,   type: i16}              # output shaft, 1/100 rpm
      - {name: rpm_r_c,   type: i16}
      - {name: cnt_l,     type: i32}              # encoder counts
      - {name: cnt_r,     type: i32}
      - {name: vbat_mv,   type: u16}
      # Pose in the course frame: origin = start pose, x forward, y left, yaw CCW from x.
      - {name: x_mm,      type: i32}
      - {name: y_mm,      type: i32}
      - {name: yaw_mrad,  type: i16}
  # FIRMWARE_SPEC.md §8.4 `TELEM_SLOW`: 35 bytes, 1 Hz. Field order, types and units are the
  # spec's; `ev_drop` (u8 at offset 34) is D-34. The id follows this file's numbering
  # (vehicle -> PC from 0x80); §8.4 assigns type 0x03, which is DRIVE here.
  TELEM_SLOW:
    id: 0x83
    dir: veh2pc
    fields:
      - {name: t_ms,        type: u32}   # offset 0, ms since boot
      - {name: bat,         type: u16}   # 4, mV
      - {name: sig_x,       type: u16}   # 6, mm (sqrt P)
      - {name: sig_y,       type: u16}   # 8, mm
      - {name: sig_th,      type: u16}   # 10, 0.01 deg
      - {name: bg,          type: i16}   # 12, 0.001 deg/s
      - {name: scale,       type: i16}   # 14, ppm, (s - 1)*1e6
      - {name: imu_t,       type: i16}   # 16, 0.01 degC
      - {name: fault_first, type: u16}   # 18, fault code
      - {name: n_faults,    type: u8}    # 20, active faults
      - {name: cpu,         type: u8}    # 21, % load
      - {name: ovr_ctrl,    type: u16}   # 22, S_CTRL overruns since boot
      - {name: rx_err,      type: u16}   # 24, radio frame errors since boot
      - {name: ekf_acc,     type: u16}   # 26, accepted aiding updates since boot
      - {name: ekf_rej,     type: u16}   # 28, rejected aiding updates since boot
      - {name: stack_free,  type: u16}   # 30, bytes, high-water mark
      - {name: vl_alive,    type: u8}    # 32, bit i = sensor i fresh
      - {name: sens,        type: u8}    # 33, bit 0 IMU alive, 1 battery present, 2 course valid
      - {name: ev_drop,     type: u8}    # 34, events dropped since boot, saturating at 255
